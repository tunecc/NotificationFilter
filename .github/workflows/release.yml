name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install packaging tools
        run: |
          brew install bash dpkg ldid ripgrep
          BREW_PREFIX="$(brew --prefix)"
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Prepare roothide Theos
        run: |
          sudo mkdir -p /opt
          if [ ! -d /opt/theos ]; then
            sudo git clone --depth 1 --recursive https://github.com/roothide/theos.git /opt/theos
          else
            cd /opt/theos
            sudo git fetch --depth 1 origin master
            sudo git reset --hard FETCH_HEAD
            sudo git submodule update --init --recursive
          fi
          sudo ln -sfn /opt/theos/vendor/include /opt/include
          test -f /opt/theos/vendor/include/roothide.h
          test -f /opt/theos/vendor/include/rootless.h
          test -f /opt/theos/vendor/include/rootless-compat.h

      - name: Export Theos path
        run: echo "THEOS=/opt/theos" >> "$GITHUB_ENV"

      - name: Verify release tag matches project version
        run: |
          PACKAGE_VERSION="$(awk -F': ' '$1 == "Version" { print $2; exit }' control)"
          PREFS_SHORT_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - NotificationFilterPrefs/Resources/Info.plist)"
          PREFS_BUILD_VERSION="$(plutil -extract CFBundleVersion raw -o - NotificationFilterPrefs/Resources/Info.plist)"
          TAG_VERSION="${RELEASE_TAG#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match control version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

          if [ "$PREFS_SHORT_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match CFBundleShortVersionString ($PREFS_SHORT_VERSION)." >&2
            exit 1
          fi

          if [ "$PREFS_BUILD_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match CFBundleVersion ($PREFS_BUILD_VERSION)." >&2
            exit 1
          fi

      - name: Probe build environment
        run: |
          command -v make
          command -v dpkg-deb
          command -v ldid
          command -v otool
          command -v rg
          test -n "$THEOS"
          test -d "$THEOS"
          test -f "$THEOS/vendor/include/roothide.h"
          test -f "$THEOS/vendor/include/rootless.h"
          test -f "$THEOS/vendor/include/rootless-compat.h"
          xcodebuild -version

      - name: Build packages
        run: |
          BREW_BASH="$(brew --prefix)/bin/bash"
          "$BREW_BASH" scripts/build_packages.sh

      - name: Verify expected release assets
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          test -f "out/NotificationFilter_${TAG_VERSION}_rootful_arm.deb"
          test -f "out/NotificationFilter_${TAG_VERSION}_rootless_arm64.deb"
          test -f "out/NotificationFilter_${TAG_VERSION}_roothide_arm64e.deb"
          ls -l out/NotificationFilter_*

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi

          gh release upload "$RELEASE_TAG" out/NotificationFilter_* --clobber
